<section
  class="content-section news-section"
  id="news"
  aria-labelledby="news-title"
>
  <header class="content-section-header">
    <p class="section-label"><span aria-hidden="true"></span>Updates</p>
    <h2 id="news-title">Latest news</h2>
  </header>

  <div class="news-list" id="news-list">
    {% assign sorted_news = site.news | sort: 'date' | reverse %}
    {% for item in sorted_news %}
    <article class="news-item">
      <time datetime="{{ item.date | date: '%Y-%m-%d' }}">
        <span>{{ item.date | date: "%b" }}</span>
        {{ item.date | date: "%Y" }}
      </time>
      <div>{{ item.content | markdownify }}</div>
    </article>
    {% endfor %}
  </div>

  <button
    class="news-toggle"
    id="news-toggle"
    type="button"
    aria-expanded="false"
    aria-controls="news-list"
  >
    <span>Show all news</span>
    <svg aria-hidden="true" viewBox="0 0 20 20">
      <path d="m5 8 5 5 5-5" />
    </svg>
  </button>
</section>
